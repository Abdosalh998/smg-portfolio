version: '3.8'

services:
  mongo:
    image: mongo:6.0
    container_name: smg_mongo_db
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smg_backend_api
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/smg_db
      - JWT_SECRET=smg_turbo_fan_secure_jwt_secret_2026
      - JWT_EXPIRES_IN=7d
      - UPLOAD_DIR=uploads
      - MAX_FILE_SIZE=5242880
      - FRONTEND_URL=https://portfolio.smgturbofan.com
    ports:
      # Optional: expose 5000 to host for direct API access if needed
      - "5000:5000"
    volumes:
      - smg_uploads:/app/uploads
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smg_frontend_web
    ports:
      # Expose the 'serve' static server port to the host
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
  smg_uploads:
